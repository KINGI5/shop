<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Игровой Центр</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
  body { background: #f0f2f5; color: #1a1a1a; overflow: hidden; }

  /* --- ГЛАВНОЕ МЕНЮ --- */
  #menu { padding: 16px; height: 100vh; overflow-y: auto; }
  header { text-align: center; padding: 20px 0; }
  header h1 { font-size: 26px; margin-bottom: 6px; }
  
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 20px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.15s; text-align: center; padding-bottom: 12px;}
  .card:active { transform: scale(0.95); }
  .card .emoji { font-size: 50px; padding: 20px 0; background: #e8f0ff; }
  .card .name { font-weight: 600; font-size: 14px; margin-top: 10px; }

  /* --- ЭКРАНЫ ИГР --- */
  .game-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 100; display: none; flex-direction: column; }
  .game-header { height: 50px; background: #229ED9; color: white; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: bold; flex-shrink: 0; justify-content: space-between;}
  .back-btn { background: none; border: none; color: white; font-size: 24px; margin-right: 16px; cursor: pointer; }
  .game-content { flex: 1; position: relative; overflow: hidden; background: #e0f6ff; }
  .score-text { position: absolute; top: 10px; left: 10px; font-size: 20px; font-weight: bold; color: #333; z-index: 10; text-shadow: 1px 1px 0 #fff;}

  /* Кнопка выключения звука */
  .mute-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

  /* --- ИГРА: КОТ --- */
  .cat { position: absolute; font-size: 50px; cursor: crosshair; }

  /* --- ИГРА: РАННЕР (GD) --- */
  #runnerContainer { background: #1a1a2e; }
  #runnerCanvas { display: block; width: 100%; height: 100%; }
  
  #levelsMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .level-btn { width: 80%; max-width: 300px; padding: 15px; margin: 10px 0; background: #0f3460; border: 2px solid #e94560; color: white; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .level-btn:active { background: #e94560; }
  .level-btn.locked { background: #333; border-color: #555; color: #777; cursor: not-allowed; }

  /* --- ИГРА 3: САПЁР --- */
  #sapperBoard { display: grid; grid-template-columns: repeat(8, 35px); gap: 2px; background: #999; padding: 4px; margin: 40px auto; width: fit-content; border-radius: 8px;}
  .cell { width: 35px; height: 35px; background: #ddd; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 4px; }
  .cell.revealed { background: #eee; cursor: default; }
  .cell.flag { color: red; }
  .cell.mine { background: red; color: white; }

  /* --- ИГРА 4: ЗМЕЙКА --- */
  #snakeCanvas { display: block; width: 100%; height: 100%; background: #111; }
  
  /* --- ИГРА 5: WALKICKERS --- */
  #walkCanvas { display: block; width: 100%; height: 100%; background: #87CEEB; }

  /* Оверлей Game Over */
  .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 50; text-align: center; }
  .overlay h2 { font-size: 30px; margin-bottom: 15px; }
  .overlay button { padding: 12px 24px; font-size: 18px; border-radius: 10px; border: none; background: #229ED9; color: white; font-weight: bold; margin: 5px; }

</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu">
  <header><h1>🕹️ Игровой Центр</h1></header>
  <div class="grid">
    <div class="card" onclick="openGame('cat')"><div class="emoji">🐈</div><div class="name">Поймай Кота</div></div>
    <div class="card" onclick="openGame('runner')"><div class="emoji">🟨</div><div class="name">Кубик-Раннер</div></div>
    <div class="card" onclick="openGame('sapper')"><div class="emoji">💣</div><div class="name">Сапёр</div></div>
    <div class="card" onclick="openGame('snake')"><div class="emoji">🐍</div><div class="name">Змейка</div></div>
    <div class="card" onclick="openGame('walk')"><div class="emoji">🏃</div><div class="name">Прыгуны</div></div>
  </div>
</div>

<!-- ЭКРАН: КОТ -->
<div id="screen-cat" class="game-screen">
  <div class="game-header">
    <div><button class="back-btn" onclick="closeGame()">←</button> Поймай Кота</div>
    <button class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="game-content" id="catContainer">
    <div class="score-text" id="catScore">Очки: 0 | Время: 30</div>
    <div id="catGameArea" style="width:100%; height:100%; position:relative;"></div>
    <div class="overlay" id="catOver"><h2>Игра окончена!</h2><button onclick="startCat()">Ещё раз</button></div>
  </div>
</div>

<!-- ЭКРАН: РАННЕР -->
<div id="screen-runner" class="game-screen">
  <div class="game-header">
    <div><button class="back-btn" onclick="closeGame()">←</button> Геометри Даш</div>
    <button class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="game-content" id="runnerContainer">
    <div class="score-text" id="runnerScore" style="color:white; text-shadow:none;">0%</div>
    <canvas id="runnerCanvas"></canvas>
    
    <div id="levelsMenu">
      <h2 style="color:white; margin-bottom:20px;">Выбери уровень</h2>
      <button class="level-btn" onclick="startRunner(1)"><span>Уровень 1</span> <span>⭐</span></button>
      <button class="level-btn" id="lvl2Btn" onclick="startRunner(2)"><span>Уровень 2</span> <span id="lock2">🔒</span></button>
      <button class="level-btn" id="lvl3Btn" onclick="startRunner(3)"><span>Уровень 3</span> <span id="lock3">🔒</span></button>
    </div>

    <div class="overlay" id="runnerOver">
      <h2>Ты врезался в шипы!</h2>
      <button onclick="startRunner(currentLevel)">Заново</button>
      <button onclick="showLevels()" style="background:#555;">К уровням</button>
    </div>
    <div class="overlay" id="runnerWin" style="background:rgba(46, 213, 115, 0.9);">
      <h2>Уровень пройден!</h2>
      <button onclick="nextLevel()">Дальше</button>
      <button onclick="showLevels()" style="background:#555;">К уровням</button>
    </div>
  </div>
</div>

<!-- ЭКРАН: САПЁР -->
<div id="screen-sapper" class="game-screen">
  <div class="game-header">
    <div><button class="back-btn" onclick="closeGame()">←</button> Сапёр</div>
    <button class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="game-content" style="background: #fff; overflow-y: auto;">
    <div class="score-text" style="color:black">Осталось флажков: <span id="flagsLeft">10</span></div>
    <div id="sapperBoard"></div>
    <div class="overlay" id="sapperOver"><h2 id="sapperMsg">Бум!</h2><button onclick="startSapper()">Заново</button></div>
  </div>
</div>

<!-- ЭКРАН: ЗМЕЙКА -->
<div id="screen-snake" class="game-screen">
  <div class="game-header">
    <div><button class="back-btn" onclick="closeGame()">←</button> Змейка</div>
    <button class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="game-content">
    <div class="score-text" style="color:white">Счёт: <span id="snakeScore">0</span></div>
    <canvas id="snakeCanvas"></canvas>
    <div class="overlay" id="snakeOver"><h2>Ты проиграл!</h2><button onclick="startSnake()">Заново</button></div>
  </div>
</div>

<!-- ЭКРАН: WALKICKERS -->
<div id="screen-walk" class="game-screen">
  <div class="game-header">
    <div><button class="back-btn" onclick="closeGame()">←</button> Прыгуны</div>
    <button class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="game-content" id="walkContainer">
    <div class="score-text">Дистанция: <span id="walkScore">0</span></div>
    <canvas id="walkCanvas"></canvas>
    <div class="overlay" id="walkOver"><h2>Ты упал!</h2><button onclick="startWalk()">Заново</button></div>
  </div>
</div>


<script>
// ==========================================
// МУЗЫКАЛЬНЫЙ ДВИЖОК (8-БИТ)
// ==========================================
let audioCtx;
let isMuted = false;
let musicInterval;
let currentMelody = [];
let noteIndex = 0;

// Ноты (частоты)
const NOTES = {
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00,
  REST: 0
};

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playNote(freq, duration) {
  if (isMuted || freq === 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'square'; // Квадратная волна = 8-битный звук
  osc.frequency.value = freq;
  
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function startMusic(melody, tempo = 150) {
  initAudio();
  stopMusic();
  currentMelody = melody;
  noteIndex = 0;
  const beatDuration = 60000 / tempo;
  
  musicInterval = setInterval(() => {
    if (isMuted) return;
    let note = currentMelody[noteIndex];
    if (note !== "REST") {
      playNote(NOTES[note], beatDuration / 1000);
    }
    noteIndex = (noteIndex + 1) % currentMelody.length;
  }, beatDuration);
}

function stopMusic() {
  clearInterval(musicInterval);
}

function toggleMute() {
  isMuted = !isMuted;
  document.querySelectorAll('.mute-btn').forEach(btn => {
    btn.textContent = isMuted ? '🔇' : '🔊';
  });
}

// Мелодии для игр
const MELODY_CAT = ["C4", "E4", "G4", "E4", "C4", "E4", "G4", "E4", "F4", "A4", "C5", "A4", "F4", "A4", "C5", "A4"];
const MELODY_RUNNER = ["E4", "E4", "REST", "E4", "REST", "C4", "E4", "REST", "G4", "REST", "REST", "REST", "G4", "REST", "REST", "REST"]; // Как в Марио
const MELODY_SAPPER = ["C4", "REST", "G4", "REST", "C4", "REST", "G4", "REST"]; // Спокойная
const MELODY_SNAKE = ["A4", "C5", "E5", "A5", "E5", "C5", "A4", "REST"]; // Быстрая
const MELODY_WALK = ["C4", "D4", "E4", "G4", "C5", "G4", "E4", "D4"]; // Веселая


// ==========================================
// УПРАВЛЕНИЕ
// ==========================================
function openGame(game) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('screen-' + game).style.display = 'flex';
  
  initAudio(); // Включаем аудио при первом клике
  
  if (game === 'cat') { startCat(); startMusic(MELODY_CAT, 200); }
  if (game === 'runner') { showLevels(); startMusic(MELODY_RUNNER, 220); }
  if (game === 'sapper') { startSapper(); startMusic(MELODY_SAPPER, 100); }
  if (game === 'snake') { startSnake(); startMusic(MELODY_SNAKE, 180); }
  if (game === 'walk') { startWalk(); startMusic(MELODY_WALK, 160); }
}

let activeTimers = [];
function closeGame() {
  document.querySelectorAll('.game-screen').forEach(el => el.style.display = 'none');
  document.getElementById('menu').style.display = 'block';
  stopMusic();
  activeTimers.forEach(t => clearInterval(t));
  activeTimers = [];
  walkGameOver = true; snakeGameOver = true; runnerGameOver = true;
}

// ==========================================
// 1. КОТ
// ==========================================
let catScore = 0, catTime = 30, catT, catS;
function startCat() {
  catScore = 0; catTime = 30;
  document.getElementById('catOver').style.display = 'none';
  const area = document.getElementById('catGameArea'); area.innerHTML = "";
  const scoreEl = document.getElementById('catScore');
  
  clearInterval(catT); clearInterval(catS);

  catT = setInterval(() => {
    catTime--; scoreEl.textContent = `Очки: ${catScore} | Время: ${catTime}`;
    if (catTime <= 0) { clearInterval(catT); clearInterval(catS); area.innerHTML=""; document.getElementById('catOver').style.display = 'flex'; }
  }, 1000);
  
  catS = setInterval(() => {
    area.innerHTML = "";
    const c = document.createElement("div"); c.className = "cat"; c.textContent = "🐈";
    c.style.left = Math.random() * (area.clientWidth - 60) + "px";
    c.style.top = Math.random() * (area.clientHeight - 60) + "px";
    c.onmousedown = c.ontouchstart = (e) => { e.preventDefault(); catScore++; scoreEl.textContent = `Очки: ${catScore} | Время: ${catTime}`; c.remove(); };
    area.appendChild(c);
  }, 800);
  activeTimers.push(catT, catS);
}

// ==========================================
// 2. ГЕОМЕТРИ ДАШ (РАННЕР)
// ==========================================
let runnerGameOver = true, runnerWin = false, runnerCanvas, runnerCtx, runnerAnim;
let player, mapObjects, progress, currentLevel = 1, gameSpeed, jumpForce, gravity;
let unlockedLevels = parseInt(localStorage.getItem('gd_unlocked')) || 1;

function showLevels() {
  runnerGameOver = true;
  document.getElementById('runnerOver').style.display = 'none';
  document.getElementById('runnerWin').style.display = 'none';
  document.getElementById('levelsMenu').style.display = 'flex';
  
  if (unlockedLevels >= 2) { document.getElementById('lvl2Btn').classList.remove('locked'); document.getElementById('lock2').textContent = "▶️"; }
  if (unlockedLevels >= 3) { document.getElementById('lvl3Btn').classList.remove('locked'); document.getElementById('lock3').textContent = "▶️"; }
}

function startRunner(level) {
  if (level > unlockedLevels) return;

  currentLevel = level;
  document.getElementById('levelsMenu').style.display = 'none';
  document.getElementById('runnerOver').style.display = 'none';
  document.getElementById('runnerWin').style.display = 'none';
  
  runnerCanvas = document.getElementById('runnerCanvas');
  runnerCtx = runnerCanvas.getContext('2d');
  runnerCanvas.width = runnerCanvas.parentElement.clientWidth;
  runnerCanvas.height = runnerCanvas.parentElement.clientHeight;
  
  runnerGameOver = false; runnerWin = false; progress = 0; mapObjects = [];
  
  gameSpeed = level === 1 ? 5 : (level === 2 ? 6 : 7.5);
  jumpForce = -11.5;
  gravity = 0.65;

  player = { x: 80, y: runnerCanvas.height - 100, w: 30, h: 30, vy: 0, jump: false, rot: 0, canOrbJump: false };

  let startX = 400;
  let totalDist = runnerCanvas.width * 3;
  
  for (let i = startX; i < totalDist; i += 400) {
    let rand = Math.random();
    if (rand < 0.4) {
      mapObjects.push({ type: 'spike', x: i, y: runnerCanvas.height - 70, w: 30, h: 30 });
    } else if (rand < 0.6) {
      mapObjects.push({ type: 'spike', x: i, y: runnerCanvas.height - 70, w: 30, h: 30 });
      mapObjects.push({ type: 'spike', x: i + 30, y: runnerCanvas.height - 70, w: 30, h: 30 });
    } else if (rand < 0.8) {
      mapObjects.push({ type: 'block', x: i, y: runnerCanvas.height - 150, w: 100, h: 20 });
      mapObjects.push({ type: 'spike', x: i + 30, y: runnerCanvas.height - 70, w: 30, h: 30 });
    } else {
      mapObjects.push({ type: 'orb', x: i, y: runnerCanvas.height - 130, w: 25, h: 25 });
      mapObjects.push({ type: 'spike', x: i + 100, y: runnerCanvas.height - 70, w: 30, h: 30 });
    }
  }

  const doJump = () => { 
    if (runnerGameOver || runnerWin) return;
    if (!player.jump) { player.vy = jumpForce; player.jump = true; } 
    else if (player.canOrbJump) { player.vy = jumpForce - 1.5; player.canOrbJump = false; }
  };
  
  document.getElementById('runnerContainer').onmousedown = doJump;
  document.getElementById('runnerContainer').ontouchstart = (e) => { e.preventDefault(); doJump(); };

  cancelAnimationFrame(runnerAnim);
  
  function loop() {
    if (runnerGameOver || runnerWin) return;

    player.vy += gravity; player.y += player.vy; player.rot += gameSpeed * 0.05;
    let groundY = runnerCanvas.height - 70;
    
    if (player.y > groundY - player.h + 30) { 
      player.y = groundY - player.h + 30; player.vy = 0; player.jump = false;
      player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
    }
    
    progress += (gameSpeed / (runnerCanvas.width * 3)) * 100; 
    document.getElementById('runnerScore').textContent = Math.floor(progress) + "%";
    
    if (progress >= 100) {
      runnerWin = true;
      document.getElementById('runnerWin').style.display = 'flex';
      if (currentLevel === unlockedLevels && unlockedLevels < 3) {
        unlockedLevels++;
        localStorage.setItem('gd_unlocked', unlockedLevels);
      }
      return;
    }

    player.canOrbJump = false;

    for (let i = mapObjects.length - 1; i >= 0; i--) {
      let o = mapObjects[i];
      o.x -= gameSpeed;

      if (o.type === 'spike') {
        let hitX = player.x + 5; let hitW = player.w - 10;
        if (hitX < o.x + o.w - 5 && hitX + hitW > o.x + 5 && player.y + player.h > o.y + 10) {
          runnerGameOver = true; document.getElementById('runnerOver').style.display = 'flex';
        }
      } else if (o.type === 'block') {
        if (player.vy > 0 && player.y + player.h > o.y && player.y + player.h < o.y + o.h + 15 && player.x + player.w > o.x && player.x < o.x + o.w) {
          player.y = o.y - player.h + 15; player.vy = 0; player.jump = false;
          player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
        }
      } else if (o.type === 'orb') {
        if (player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
          player.canOrbJump = true;
        }
      }
    }

    runnerCtx.clearRect(0, 0, runnerCanvas.width, runnerCanvas.height);
    runnerCtx.fillStyle = "#0f3460"; runnerCtx.fillRect(0, groundY + 30, runnerCanvas.width, 100);
    runnerCtx.fillStyle = "#e94560"; runnerCtx.fillRect(0, groundY + 30, runnerCanvas.width, 4);

    for (let o of mapObjects) {
      if (o.type === 'spike') {
        runnerCtx.fillStyle = "#e94560"; runnerCtx.beginPath();
        runnerCtx.moveTo(o.x, o.y + o.h); runnerCtx.lineTo(o.x + o.w/2, o.y); runnerCtx.lineTo(o.x + o.w, o.y + o.h);
        runnerCtx.fill();
      } else if (o.type === 'block') {
        runnerCtx.fillStyle = "#f39c12"; runnerCtx.fillRect(o.x, o.y, o.w, o.h);
        runnerCtx.strokeStyle = "#d35400"; runnerCtx.lineWidth = 2; runnerCtx.strokeRect(o.x, o.y, o.w, o.h);
      } else if (o.type === 'orb') {
        runnerCtx.beginPath(); runnerCtx.arc(o.x + o.w/2, o.y + o.h/2, o.w/2, 0, Math.PI * 2);
        runnerCtx.fillStyle = player.canOrbJump ? "#ffff00" : "#f1c40f"; runnerCtx.fill();
        runnerCtx.strokeStyle = "#fff"; runnerCtx.lineWidth = 2; runnerCtx.stroke();
        runnerCtx.beginPath(); runnerCtx.arc(o.x + o.w/2, o.y + o.h/2, o.w/4, 0, Math.PI * 2);
        runnerCtx.fillStyle = "#fff"; runnerCtx.fill();
      }
    }

    runnerCtx.save();
    runnerCtx.translate(player.x + player.w/2, player.y + player.h/2);
    runnerCtx.rotate(player.rot);
    runnerCtx.fillStyle = "#FFD700"; runnerCtx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    runnerCtx.strokeStyle = "#000"; runnerCtx.lineWidth = 2; runnerCtx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
    runnerCtx.rotate(-player.rot); 
    runnerCtx.fillStyle = "#000"; runnerCtx.fillRect(-5, -8, 4, 6); runnerCtx.fillRect(5, -8, 4, 6); 
    runnerCtx.beginPath(); runnerCtx.arc(0, 0, 8, 0, Math.PI);
    runnerCtx.strokeStyle = "#000"; runnerCtx.lineWidth = 2; runnerCtx.stroke();
    runnerCtx.restore();

    runnerAnim = requestAnimationFrame(loop);
  }
  loop();
}

function nextLevel() {
  if (currentLevel < 3) startRunner(currentLevel + 1);
  else showLevels();
}

// ==========================================
// 3. САПЁР
// ==========================================
let sapperGrid = [], sapperRevealed = 0, sapperFlags = 10, sapperGameOver = false;
function startSapper() {
  document.getElementById('sapperOver').style.display = 'none';
  const board = document.getElementById('sapperBoard');
  board.innerHTML = "";
  sapperGrid = []; sapperRevealed = 0; sapperFlags = 10; sapperGameOver = false;
  document.getElementById('flagsLeft').textContent = sapperFlags;
  
  for(let i=0; i<64; i++) sapperGrid.push({ mine: false, rev: false, flag: false, count: 0 });
  let mines = 0;
  while(mines < 10) { let r = Math.floor(Math.random()*64); if(!sapperGrid[r].mine) { sapperGrid[r].mine = true; mines++; } }
  
  for(let i=0; i<64; i++) {
    if(sapperGrid[i].mine) continue;
    let c = 0; let row = Math.floor(i/8); let col = i%8;
    for(let r=-1; r<=1; r++) for(let c2=-1; c2<=1; c2++) {
      let nr = row+r, nc = col+c2;
      if(nr>=0 && nr<8 && nc>=0 && nc<8 && sapperGrid[nr*8+nc].mine) c++;
    }
    sapperGrid[i].count = c;
  }

  sapperGrid.forEach((cell, i) => {
    let div = document.createElement('div'); div.className = "cell"; div.id = "cell-"+i;
    div.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(i); };
    let timer;
    div.ontouchstart = () => { timer = setTimeout(() => toggleFlag(i), 400); };
    div.ontouchend = () => clearTimeout(timer);
    div.onclick = () => { if(!div.longPress) reveal(i); };
    board.appendChild(div);
  });
}

function toggleFlag(i) {
  if (sapperGameOver || sapperGrid[i].rev) return;
  let cell = sapperGrid[i]; cell.flag = !cell.flag;
  sapperFlags += cell.flag ? -1 : 1;
  document.getElementById('flagsLeft').textContent = sapperFlags;
  let div = document.getElementById("cell-"+i);
  div.textContent = cell.flag ? "🚩" : "";
  div.classList.toggle("flag", cell.flag);
}

function reveal(i) {
  if (sapperGameOver || sapperGrid[i].rev || sapperGrid[i].flag) return;
  let cell = sapperGrid[i]; cell.rev = true; sapperRevealed++;
  let div = document.getElementById("cell-"+i);
  div.classList.add("revealed");
  
  if (cell.mine) {
    div.classList.add("mine"); div.textContent = "💣";
    sapperGameOver = true; document.getElementById('sapperMsg').textContent = "Бум! Ты проиграл."; document.getElementById('sapperOver').style.display = 'flex';
    return;
  }
  
  if (cell.count > 0) {
    div.textContent = cell.count;
    div.style.color = ["", "blue", "green", "red", "purple", "maroon", "turquoise", "black", "gray"][cell.count];
  } else {
    let row = Math.floor(i/8); let col = i%8;
    for(let r=-1; r<=1; r++) for(let c2=-1; c2<=1; c2++) {
      let nr = row+r, nc = col+c2;
      if(nr>=0 && nr<8 && nc>=0 && nc<8) reveal(nr*8+nc);
    }
  }
  
  if (sapperRevealed === 54) {
    sapperGameOver = true; document.getElementById('sapperMsg').textContent = "Победа!"; document.getElementById('sapperOver').style.display = 'flex';
  }
}

// ==========================================
// 4. ЗМЕЙКА
// ==========================================
let snakeGameOver = true, snake, snakeDir, snakeFood, snakeScore, snakeCanvas, snakeCtx, snakeLoop;
function startSnake() {
  document.getElementById('snakeOver').style.display = 'none';
  snakeCanvas = document.getElementById('snakeCanvas');
  snakeCtx = snakeCanvas.getContext('2d');
  snakeCanvas.width = snakeCanvas.parentElement.clientWidth;
  snakeCanvas.height = snakeCanvas.parentElement.clientHeight;
  
  snakeGameOver = false; snake = [{x: 5, y: 5}]; snakeDir = {x: 1, y: 0}; snakeFood = {x: 10, y: 10}; snakeScore = 0;
  document.getElementById('snakeScore').textContent = 0;
  const size = 20;
  
  let sx, sy;
  snakeCanvas.ontouchstart = (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  snakeCanvas.ontouchend = (e) => {
    let dx = e.changedTouches[0].clientX - sx; let dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) { if(dx>0 && snakeDir.x===-1) return; if(dx<0 && snakeDir.x===1) return; snakeDir = {x: dx>0?1:-1, y:0}; } 
    else { if(dy>0 && snakeDir.y===-1) return; if(dy<0 && snakeDir.y===1) return; snakeDir = {x: 0, y: dy>0?1:-1}; }
  };
  window.onkeydown = (e) => {
    if(e.key==="ArrowUp" && snakeDir.y!==1) snakeDir={x:0,y:-1};
    if(e.key==="ArrowDown" && snakeDir.y!==-1) snakeDir={x:0,y:1};
    if(e.key==="ArrowLeft" && snakeDir.x!==1) snakeDir={x:-1,y:0};
    if(e.key==="ArrowRight" && snakeDir.x!==-1) snakeDir={x:1,y:0};
  };

  clearInterval(snakeLoop);
  snakeLoop = setInterval(() => {
    if (snakeGameOver) return;
    let head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
    
    if (head.x < 0 || head.x >= snakeCanvas.width/size || head.y < 0 || head.y >= snakeCanvas.height/size) return endSnake();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return endSnake();
    
    snake.unshift(head);
    if (head.x === snakeFood.x && head.y === snakeFood.y) {
      snakeScore += 10; document.getElementById('snakeScore').textContent = snakeScore;
      snakeFood = {x: Math.floor(Math.random()*(snakeCanvas.width/size)), y: Math.floor(Math.random()*(snakeCanvas.height/size))};
    } else { snake.pop(); }
    
    snakeCtx.fillStyle = "#111"; snakeCtx.fillRect(0,0,snakeCanvas.width,snakeCanvas.height);
    snakeCtx.fillStyle = "#ff4757"; snakeCtx.fillRect(snakeFood.x*size, snakeFood.y*size, size-2, size-2);
    snakeCtx.fillStyle = "#2ed573";
    snake.forEach(s => snakeCtx.fillRect(s.x*size, s.y*size, size-2, size-2));
  }, 100);
  activeTimers.push(snakeLoop);
}
function endSnake() { snakeGameOver = true; document.getElementById('snakeOver').style.display = 'flex'; }

// ==========================================
// 5. WALKICKERS (ПРЫГУНЫ)
// ==========================================
let walkGameOver = true, walkCanvas, walkCtx, walkPlayer, walkPlats, walkEnemies, walkScore, walkCameraX, walkAnim;
function startWalk() {
  document.getElementById('walkOver').style.display = 'none';
  walkCanvas = document.getElementById('walkCanvas');
  walkCtx = walkCanvas.getContext('2d');
  walkCanvas.width = walkCanvas.parentElement.clientWidth;
  walkCanvas.height = walkCanvas.parentElement.clientHeight;
  
  walkGameOver = false; walkCameraX = 0; walkScore = 0; 
  walkPlayer = { x: 50, y: walkCanvas.height - 150, w: 30, h: 30, vy: 0, vx: 0 };
  walkPlats = [{x: 0, y: walkCanvas.height - 50, w: 400}, {x: 450, y: walkCanvas.height - 100, w: 200}];
  walkEnemies = [{x: 200, y: walkCanvas.height - 80, w: 30, h: 30, dir: 1}];
  document.getElementById('walkScore').textContent = 0;

  let leftBtn = false, rightBtn = false;
  walkCanvas.ontouchstart = (e) => {
    let x = e.touches[0].clientX;
    if (x < walkCanvas.width/2) leftBtn = true; else rightBtn = true;
    if (!walkPlayer.jumping && walkPlayer.onGround) { walkPlayer.vy = -12; walkPlayer.jumping = true; }
  };
  walkCanvas.ontouchend = () => { leftBtn = false; rightBtn = false; };
  
  window.onkeydown = (e) => {
    if(e.key==="ArrowLeft") leftBtn = true;
    if(e.key==="ArrowRight") rightBtn = true;
    if(e.key==="ArrowUp" && !walkPlayer.jumping) { walkPlayer.vy = -12; walkPlayer.jumping = true; }
  };
  window.onkeyup = (e) => {
    if(e.key==="ArrowLeft") leftBtn = false;
    if(e.key==="ArrowRight") rightBtn = false;
  };

  cancelAnimationFrame(walkAnim);
  function loop() {
    if (walkGameOver) return;
    
    walkPlayer.vx = leftBtn ? -5 : (rightBtn ? 5 : 0);
    walkPlayer.x += walkPlayer.vx;
    walkPlayer.vy += 0.5; walkPlayer.y += walkPlayer.vy;
    
    walkPlayer.onGround = false;
    walkPlats.forEach(p => {
      if (walkPlayer.x < p.x + p.w && walkPlayer.x + walkPlayer.w > p.x && 
          walkPlayer.y + walkPlayer.h > p.y && walkPlayer.y + walkPlayer.h < p.y + 20 && walkPlayer.vy > 0) {
        walkPlayer.y = p.y - walkPlayer.h; walkPlayer.vy = 0; walkPlayer.jumping = false; walkPlayer.onGround = true;
      }
    });

    if (walkPlayer.y > walkCanvas.height) return endWalk();

    if (walkPlats[walkPlats.length-1].x < walkCameraX + walkCanvas.width + 200) {
      let last = walkPlats[walkPlats.length-1];
      walkPlats.push({x: last.x + last.w + Math.random()*100 + 50, y: walkCanvas.height - Math.random()*200 - 50, w: Math.random()*100 + 50});
      walkScore += 10; document.getElementById('walkScore').textContent = walkScore;
    }

    walkEnemies.forEach(e => {
      e.x += e.dir * 2;
      if (Math.abs(e.x - walkPlayer.x) > 300) e.dir *= -1;
      if (walkPlayer.x < e.x + e.w && walkPlayer.x + walkPlayer.w > e.x && 
          walkPlayer.y < e.y + e.h && walkPlayer.y + walkPlayer.h > e.y) {
        endWalk();
      }
    });

    walkCameraX = walkPlayer.x - walkCanvas.width / 3;

    walkCtx.clearRect(0, 0, walkCanvas.width, walkCanvas.height);
    walkCtx.save();
    walkCtx.translate(-walkCameraX, 0);
    
    walkCtx.fillStyle = "#8B4513";
    walkPlats.forEach(p => walkCtx.fillRect(p.x, p.y, p.w, 20));
    
    walkCtx.fillStyle = "#ff4757";
    walkEnemies.forEach(e => walkCtx.fillRect(e.x, e.y, e.w, e.h));

    walkCtx.fillStyle = "#FFD700";
    walkCtx.fillRect(walkPlayer.x, walkPlayer.y, walkPlayer.w, walkPlayer.h);
    
    walkCtx.restore();
    walkAnim = requestAnimationFrame(loop);
  }
  loop();
}
function endWalk() { walkGameOver = true; document.getElementById('walkOver').style.display = 'flex'; }

</script>
